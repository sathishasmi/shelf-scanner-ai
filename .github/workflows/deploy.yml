name: MLOps CI/CD Pipeline

# Trigger the pipeline every time code is pushed to the main branch
on:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8

    - name: Run Code Formatter Check (Black)
      run: black --check app/

    - name: Run Code Linter Check (Flake8)
      run: flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Render
      # This triggers Render's Deploy Hook to automatically pull your code and rebuild
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"